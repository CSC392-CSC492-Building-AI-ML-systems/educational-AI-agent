<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AutoDocs AI</title>

    <!-- xterm & page styles -->
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script defer src="frontend.js"></script>
    <script defer src="tree.js"></script>
  </head>

  <body>
    <header class="site-header">
      <h1>AutoDocs AI Terminal</h1>
      <p>A browser-based terminal for testing and interaction.</p>
    </header>

    <!-- ─────────────── 3-column dashboard ─────────────── -->
    <main class="dashboard">
      <!-- COLUMN 1 -->
      <section class="left-rail">
        <button id="uploadBtn">Upload Asciinema</button>
        <input type="file" id="txtFile" accept=".txt" hidden />

        <div class="tree-wrap">
          <h3>Event Tree</h3>

          <!-- start EMPTY; tree.js will fill this UL -->
          <ul id="eventTree">
            <li class="placeholder">No file loaded …</li>
          </ul>
        </div>

        <div class="current-note boxy">
          <h4 id="currentDepthLabel">Annotation</h4>
          <p id="currentNote">⟨ upload a file first ⟩</p>
        </div>
      </section>

      <!-- COLUMN 2 ––––––––––––––––––––––––––––––––––––––– -->
      <section class="middle-rail">
        <!-- parent-annotation sits above the terminal -->
        <textarea
          id="parentAnnotation"
          class="noteBox"
          placeholder="⟨annotation of the parent of the current event⟩"
          readonly
        ></textarea>

        <div id="terminal" class="terminal-pane"></div>
      </section>

      <!-- COLUMN 3 ––––––––––––––––––––––––––––––––––––––– -->
      <section class="right-rail">
        <textarea
          id="siblingAnnotation"
          class="noteBox"
          placeholder="⟨annotation of the parent's sibling⟩"
          readonly
        ></textarea>
      </section>
    </main>
  </body>
</html>


<!-- 
NOTE: will need to install:

npm install @xterm/xterm  // for terminal UI
npm install node-pty@latest  // for terminal emulation
npm install ws  // for WebSocket support
npm install concurrently  // for running both server and client in development
npm install live-server // for serving static files in development

and will be able to run everything with: npm start
 -->
