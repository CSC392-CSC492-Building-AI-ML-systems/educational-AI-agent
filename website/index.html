<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AutoDocs AI</title>

    <!-- xterm & page styles -->
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script defer src="tree.js"></script>
    <script defer src="frontend.js"></script>
  </head>

  <body>
    <header class="site-header">
      <h1>AutoDocs AI Terminal</h1>
      <p>A browser-based terminal for testing and interaction.</p>

      <!-- feedback controls -->
      <div class="feedback-controls">
        <button id="feedbackBtn">Enter Feedback</button>
        <button id="showFeedbackBtn">Show Feedback</button>
      </div>
    </header>

    <!-- ENTER FEEDBACK MODAL -->
    <div id="feedbackModal" class="modal">
      <div class="modal-content">
        <h3>Feedback for Selected Event</h3>
        <textarea id="feedbackInput" rows="6"></textarea>
        <div class="modal-buttons">
          <button id="submitFeedback">Submit</button>
          <button id="cancelFeedback">Cancel</button>
        </div>
      </div>
    </div>

    <!-- SHOW FEEDBACK LIST MODAL -->
    <div id="feedbackListModal" class="modal">
      <div class="modal-content">
        <h3>All Feedback</h3>
        <ul id="feedbackList"></ul>
        <button id="closeFeedbackList">Close</button>
      </div>
    </div>

    <!-- ─────────────── 3-column dashboard ─────────────── -->
    <main class="dashboard">
      <!-- COLUMN 1 -->
      <section class="left-rail">
        <button id="uploadBtn">Upload Asciinema</button>
        <input type="file" id="txtFile" accept=".txt" hidden />

        <div class="tree-wrap">
          <h3>Event Tree</h3>

          <!-- start EMPTY; tree.js will fill this UL -->
          <ul id="eventTree">
            <li class="placeholder">No file loaded …</li>
          </ul>
        </div>

        <div class="current-note boxy">
          <h4 id="currentDepthLabel">Annotation</h4>
          <p id="currentNote">⟨ upload a file first ⟩</p>
        </div>
      </section>

      <!-- COLUMN 2 ––––––––––––––––––––––––––––––––––––––– -->
      <section class="middle-rail">
        <!-- parent-annotation sits above the terminal -->
        <h4 class="note-title">Parent Annotation</h4>
        <textarea
          id="parentAnnotation"
          class="noteBox"
          placeholder=""
          readonly
        ></textarea>

        <div id="terminal" class="terminal-pane"></div>
      </section>

      <!-- COLUMN 3 ––––––––––––––––––––––––––––––––––––––– -->
      <section class="right-rail">
        <h4 class="note-title">Most Recent Event</h4>
        <textarea
          id="siblingAnnotation"
          class="noteBox"
          placeholder=""
          readonly
        ></textarea>
      </section>
    </main>
  </body>
</html>
